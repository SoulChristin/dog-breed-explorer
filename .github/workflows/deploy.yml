name: Deploy

# Continuous delivery for main. Runs when a pull request is merged (any push to
# main), and rebuilds every model against the prod target from the committed raw
# partitions.
#
# There is nothing to host: the dashboard is a local Streamlit app and the
# warehouse is a DuckDB file rebuildable from the raw partitions at any time.
# So the delivery step here is the production *run* - the same models the PR
# built against dev, executed against prod and re-tested. That is what proves
# the transformations are target-agnostic: identical SQL, only the warehouse
# path differs between the two profiles.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two prod builds write the same warehouse file at once, and never
# cancel one midway - a half-built warehouse is worse than a slow one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test (prod target)
    runs-on: ubuntu-latest

    # Environment placeholder. `prod` is where deployment credentials would be
    # scoped once there is somewhere to deploy to - GitHub environments also
    # give required reviewers and branch restrictions on top of plain secrets.
    # Uncomment once a prod environment exists in repo settings:
    # environment: prod

    env:
      DBT_TARGET: prod
      # Deployment credential placeholders. Nothing here needs them today:
      # DuckDB is a local file, so profiles.yml carries no secrets, and the raw
      # data is already in the repo. A hosted warehouse or a deployed dashboard
      # would read its credentials here, from repository or environment secrets
      # - never from a committed file.
      #
      # WAREHOUSE_HOST: ${{ vars.WAREHOUSE_HOST }}
      # WAREHOUSE_USER: ${{ secrets.WAREHOUSE_USER }}
      # WAREHOUSE_PASSWORD: ${{ secrets.WAREHOUSE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # warehouse/ holds only gitignored .duckdb files, so the directories do
      # not exist in a fresh clone and DuckDB cannot create the database.
      - name: Create warehouse directories
        run: mkdir -p warehouse/dev warehouse/prod

      # The production run. dbt build executes models and their tests together,
      # so a merge that breaks the data fails here rather than passing silently.
      - name: dbt build (models + tests)
        working-directory: dog_explorer_dbt
        run: dbt build --profiles-dir . --target "$DBT_TARGET"

      # Documents the warehouse just built - it reads the database for real column
      # types and row counts, and --static inlines them into a single openable file.
      - name: dbt docs generate
        working-directory: dog_explorer_dbt
        run: dbt docs generate --profiles-dir . --target "$DBT_TARGET" --static

      # The built warehouse is deliberately not kept as an artifact. Nothing
      # consumes a hosted prod database, and it is reproducible from the raw
      # partitions on demand - what matters from this run is whether it passed.
      # The docs generated above ride along inside target/.
      - name: Upload dbt run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-run-results-prod
          path: |
            dog_explorer_dbt/target/
            dog_explorer_dbt/logs/
          retention-days: 14
          if-no-files-found: ignore
