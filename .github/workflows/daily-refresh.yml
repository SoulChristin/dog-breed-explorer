name: Daily refresh

# Scheduled ingestion. Fetches the breed catalogue, commits the raw payload back
# to the repo, then rebuilds the warehouse from it and runs every test.
#
# This is the only workflow that calls TheDogAPI, and the only one that needs
# DOG_API_KEY.
#
# It builds the models itself rather than leaving that to deploy.yml. GitHub
# deliberately does not start new workflow runs from pushes made with the
# default GITHUB_TOKEN - that is its guard against a workflow retriggering
# itself forever - so the commit pushed below will NOT trigger deploy.yml.
# Without the build step here, each night's data would land untested.

#on:
#  schedule:
#    # 02:00 UTC daily.
#    - cron: '0 2 * * *'
#  # Manual trigger, so a failed night can be re-run without waiting a day.
#  workflow_dispatch:

# Prevent two runs writing the same day's partition at once.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

# Raise an issue when the run fails.
permissions:
  contents: write
  issues: write

jobs:
  refresh:
    name: Fetch, commit, and rebuild
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip                      # reuses the wheel cache between runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The only step that reaches the network. DOG_API_KEY is injected from
      # repository secrets and is never written to disk or echoed.
      - name: Fetch from TheDogAPI
        env:
          DOG_API_KEY: ${{ secrets.DOG_API_KEY }}
        run: python src/ingest_breeds.py

      # Commit first, build second. The raw payload is the only thing that
      # cannot be regenerated once the day has passed, so it is stored before
      # anything that might fail - a broken model then fails this run without
      # costing the day's data.
      - name: Commit the day's raw payload
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw
          # Nothing to commit when the API returned an identical payload.
          # That is a successful no-op, not a failure.
          git diff --staged --quiet || git commit -m "Daily refresh: $(date -u +%Y-%m-%d)"
          git push

      # warehouse/ holds only gitignored .duckdb files, so the directories do
      # not exist in a fresh clone and DuckDB cannot create the database.
      - name: Create warehouse directories
        run: mkdir -p warehouse/dev warehouse/prod

      # dbt build interleaves models and their tests, so bad data stops the
      # models downstream of it from being built on top of it.
      - name: dbt build (models + tests, prod target)
        working-directory: dog_explorer_dbt
        run: dbt build --profiles-dir . --target prod

      # run_results.json lists the pass/fail of every model and test. Uploaded
      # even on failure, so a red night is diagnosable without a re-run.
      - name: Upload dbt run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-run-results-nightly-${{ github.run_id }}
          path: |
            dog_explorer_dbt/target/
            dog_explorer_dbt/logs/
          retention-days: 14
          if-no-files-found: ignore

      # The only signal that arrives on its own. The README badges and the
      # Actions tab both require someone to think to go and look, which is no
      # use for an unattended 02:00 UTC job - and this is the one workflow that
      # can lose data. Raising an issue routes through GitHub's own notification
      # system, so it reaches the repo owner without a webhook, a secret, or an
      # external service to keep alive.
      #
      # failure() covers any failed step, which is what makes this cover both
      # named cases: the API fetch and the dbt build (models and tests alike).
      #
      # Runs last so the artifact upload above has already completed and the
      # linked run is whole by the time anyone opens it.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Idempotent: --force updates the label if it already exists, so this
          # never fails on the second run and needs no manual setup in a fork.
          gh label create pipeline-failure \
            --color B60205 \
            --description "Automated: a scheduled pipeline run failed" \
            --force

          BODY=$(cat <<EOF
          The scheduled refresh failed on $(date -u +%Y-%m-%d) at $(date -u +%H:%M) UTC.

          **Run:** $RUN_URL

          **What this means**
          - The API fetch may not have completed, so today's \`data/raw/run_date=\` partition may be missing.
          - If the fetch succeeded but \`dbt build\` failed, the raw payload *was* committed (it is committed before the build on purpose) but the prod warehouse is stale or partially built.
          - \`dbt build\` runs models and tests together, so this also fires when the data itself is bad, not just when the SQL is broken.

          **Next steps**
          1. Open the run above and read the failing step. The \`dbt-run-results-nightly-*\` artifact has the full logs and \`run_results.json\`.
          2. Fix the cause.
          3. Re-run *Daily refresh* from the Actions tab — it is \`workflow_dispatch\`-enabled so it does not have to wait for tomorrow.

          Closing this issue is the signal that the pipeline is healthy again.
          EOF
          )

          # One issue per incident, not one per night. A run that fails five
          # nights running comments on the existing thread instead of opening
          # five near-identical issues; closing it starts a fresh one.
          EXISTING=$(gh issue list \
            --label pipeline-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "Failed again — $RUN_URL"
          else
            gh issue create \
              --title "Daily refresh failed: $(date -u +%Y-%m-%d)" \
              --body "$BODY" \
              --label pipeline-failure
          fi
