name: Daily refresh

# Scheduled ingestion. Fetches the breed catalogue, commits the raw payload back
# to the repo, then rebuilds the warehouse from it and runs every test.
#
# This is the only workflow that calls TheDogAPI, and the only one that needs
# DOG_API_KEY.
#
# It builds the models itself rather than leaving that to deploy.yml. GitHub
# deliberately does not start new workflow runs from pushes made with the
# default GITHUB_TOKEN - that is its guard against a workflow retriggering
# itself forever - so the commit pushed below will NOT trigger deploy.yml.
# Without the build step here, each night's data would land untested.

on:
  schedule:
    # 02:00 UTC daily.
    - cron: '0 2 * * *'
  # Manual trigger, so a failed night can be re-run without waiting a day.
  workflow_dispatch:

# Prevent two runs writing the same day's partition at once.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

# Least privilege: this workflow needs to push one commit, nothing more.
permissions:
  contents: write

jobs:
  refresh:
    name: Fetch, commit, and rebuild
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip                      # reuses the wheel cache between runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The only step that reaches the network. DOG_API_KEY is injected from
      # repository secrets and is never written to disk or echoed.
      - name: Fetch from TheDogAPI
        env:
          DOG_API_KEY: ${{ secrets.DOG_API_KEY }}
        run: python src/ingest_breeds.py

      # Commit first, build second. The raw payload is the only thing that
      # cannot be regenerated once the day has passed, so it is stored before
      # anything that might fail - a broken model then fails this run without
      # costing the day's data.
      - name: Commit the day's raw payload
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw
          # Nothing to commit when the API returned an identical payload.
          # That is a successful no-op, not a failure.
          git diff --staged --quiet || git commit -m "Daily refresh: $(date -u +%Y-%m-%d)"
          git push

      # warehouse/ holds only gitignored .duckdb files, so the directories do
      # not exist in a fresh clone and DuckDB cannot create the database.
      - name: Create warehouse directories
        run: mkdir -p warehouse/dev warehouse/prod

      # dbt build interleaves models and their tests, so bad data stops the
      # models downstream of it from being built on top of it.
      - name: dbt build (models + tests, prod target)
        working-directory: dog_explorer_dbt
        run: dbt build --profiles-dir . --target prod

      # run_results.json lists the pass/fail of every model and test. Uploaded
      # even on failure, so a red night is diagnosable without a re-run.
      - name: Upload dbt run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-run-results-nightly-${{ github.run_id }}
          path: |
            dog_explorer_dbt/target/
            dog_explorer_dbt/logs/
          retention-days: 14
          if-no-files-found: ignore
