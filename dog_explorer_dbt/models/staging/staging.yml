version: 2

models:
  - name: stg_breeds
    description: >
      One row per breed (latest run_date partition only), with types fixed,
      names snake_cased, and multi-value fields parsed into ranges/lists.
    columns:
      - name: breed_id
        description: Primary key. Enforces the one-row-per-breed grain of this model.
        data_tests:
          - not_null
          - unique

      - name: breed_name
        description: Trimmed breed name. Always present.
        data_tests:
          - not_null

      - name: life_span_min_years
        description: Lower bound of the life span in years; null when source life_span is null.

      - name: life_span_max_years
        description: Upper bound of the life span in years; null when source life_span is null.

      - name: height_avg_cm
        description: >
          Average breed height in cm, from the midpoint of the parsed range.
          The size measure the scatter and correlation marts read; left
          unbanded because both need the raw value.

      - name: weight_class
        description: >
          Mass band from the weight midpoint in kg. Named weight_class, never
          "size_class": it is a different measurement from height and
          correlates differently against life span.
        data_tests:
          - accepted_values:
              values: ['Toy', 'Small', 'Medium', 'Large', 'Giant']

      - name: source_file
        description: Origin file path of the row, carried through for traceability.
        data_tests:
          - not_null
